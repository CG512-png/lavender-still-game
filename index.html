<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Christmas Tree</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020304;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.title{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:clamp(18px,2.2vw,30px);letter-spacing:.18em;font-weight:700;text-shadow:0 0 24px rgba(255,215,120,.55);white-space:nowrap}.status{position:absolute;left:22px;bottom:22px;padding:12px 14px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);font-size:13px;line-height:1.6}.legend{position:absolute;right:22px;bottom:22px;padding:12px 14px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);font-size:12px;line-height:1.7;color:#f4e9cf}.camera{position:fixed;right:18px;top:18px;width:170px;height:128px;object-fit:cover;transform:scaleX(-1);border-radius:14px;border:1px solid rgba(255,255,255,.16);opacity:.66}.pill{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd76b;margin-right:7px;box-shadow:0 0 12px #ffd76b}.error{color:#ff9e9e;max-width:320px}@media(max-width:700px){.camera{width:120px;height:90px}.legend{display:none}.title{top:18px}.status{left:12px;bottom:12px}}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>
  <video id="camera" class="camera" playsinline muted></video>
  <div class="hud">
    <div class="title">GESTURE CHRISTMAS TREE</div>
    <div class="status"><div><span class="pill"></span><span id="status">正在初始化摄像头与手势识别…</span></div><div id="gesture">手势：等待识别</div><div id="theme">主题：经典圣诞</div><div id="error" class="error"></div></div>
    <div class="legend">✊ 握拳：聚合成树 + 移动旋转<br>🖐 张手：粒子炸散<br>☝ 1 指：切换颜色主题<br>✌ 2 指：开启 / 关闭飘雪<br>🤟 3 指：触发烟花</div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
