<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Christmas Tree</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020304;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.title{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:clamp(17px,2vw,28px);letter-spacing:.18em;font-weight:800;text-shadow:0 0 28px rgba(255,215,120,.65);white-space:nowrap}.status{position:absolute;left:18px;bottom:18px;padding:12px 14px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(0,0,0,.42);backdrop-filter:blur(12px);font-size:13px;line-height:1.65;max-width:min(420px,calc(100vw - 36px))}.legend{position:absolute;right:18px;bottom:18px;padding:12px 14px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(0,0,0,.42);backdrop-filter:blur(12px);font-size:12px;line-height:1.75;color:#f4e9cf}.cameraWrap{position:fixed;right:18px;top:18px;width:190px;height:142px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.18);background:#0a0c0f;box-shadow:0 12px 40px rgba(0,0,0,.35)}.camera,.handCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.camera{opacity:.72}.handCanvas{pointer-events:none}.pill{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd76b;margin-right:7px;box-shadow:0 0 12px #ffd76b}.error{color:#ff9e9e}.launcher{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;width:min(480px,calc(100vw - 32px));padding:24px;border-radius:22px;border:1px solid rgba(255,255,255,.16);background:rgba(5,7,10,.82);backdrop-filter:blur(18px);box-shadow:0 24px 90px rgba(0,0,0,.55);text-align:center}.launcher h2{margin:0 0 10px;font-size:24px}.launcher p{margin:0 0 18px;color:#d8d4ca;font-size:14px;line-height:1.65}.launcher button{appearance:none;border:0;border-radius:999px;padding:13px 22px;font-size:15px;font-weight:800;background:linear-gradient(135deg,#ffe08a,#ffb64d);color:#1a1306;cursor:pointer;box-shadow:0 8px 30px rgba(255,186,67,.28)}.launcher button:disabled{opacity:.55;cursor:default}.launcher small{display:block;margin-top:12px;color:#9f9a90;line-height:1.5}.manual{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;display:flex;gap:8px;pointer-events:auto}.manual button{border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.42);color:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px)}@media(max-width:760px){.cameraWrap{width:128px;height:96px}.legend{display:none}.manual{bottom:92px;flex-wrap:wrap;justify-content:center;width:92%}.title{top:16px}.status{left:12px;bottom:12px}}
  </style>
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/camera_utils.js"></script>
  <script src="./vendor/hands.js"></script>
</head>
<body>
  <div id="app"></div>
  <div class="cameraWrap"><video id="camera" class="camera" playsinline muted></video><canvas id="handCanvas" class="handCanvas" width="640" height="480"></canvas></div>
  <div id="launcher" class="launcher"><h2>🎄 手势圣诞树</h2><p>点击后浏览器会请求摄像头权限。允许后，把一只手完整放进右上角画面里；识别成功时会显示绿色手部骨架。</p><button id="startBtn">启用手势控制</button><small>如果拒绝过摄像头权限，请先在浏览器地址栏里重新允许。</small></div>
  <div class="hud">
    <div class="title">GESTURE CHRISTMAS TREE</div>
    <div class="status"><div><span class="pill"></span><span id="status">等待启用手势控制</span></div><div id="gesture">手势：未启动</div><div id="theme">主题：经典圣诞</div><div id="error" class="error"></div></div>
    <div class="legend">✊ 握拳：聚合成树 + 移动旋转<br>🖐 张手：粒子炸散<br>☝ 1 指：切换颜色主题<br>✌ 2 指：开启 / 关闭飘雪<br>🤟 3 指：触发烟花</div>
  </div>
  <div class="manual"><button data-action="gather">聚合</button><button data-action="burst">散开</button><button data-action="theme">换色</button><button data-action="snow">飘雪</button><button data-action="firework">烟花</button></div>
  <script src="./app.js"></script>
</body>
</html>
