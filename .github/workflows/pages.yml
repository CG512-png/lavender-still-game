name: Deploy LAVENDER, STILL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build game
        run: npm run build

      - name: Include Christmas tree app and local gesture runtime
        run: |
          mkdir -p github-pages-dist/christmas-tree/vendor
          cp christmas-tree/index.html github-pages-dist/christmas-tree/index.html
          cp christmas-tree/app.js github-pages-dist/christmas-tree/app.js
          cp node_modules/@mediapipe/camera_utils/camera_utils.js github-pages-dist/christmas-tree/vendor/camera_utils.js
          cp node_modules/@mediapipe/hands/hands.js github-pages-dist/christmas-tree/vendor/hands.js
          cp node_modules/@mediapipe/hands/hands_solution_packed_assets.data github-pages-dist/christmas-tree/vendor/hands_solution_packed_assets.data
          cp node_modules/@mediapipe/hands/hands_solution_packed_assets_loader.js github-pages-dist/christmas-tree/vendor/hands_solution_packed_assets_loader.js
          cp node_modules/@mediapipe/hands/hands_solution_simd_wasm_bin.js github-pages-dist/christmas-tree/vendor/hands_solution_simd_wasm_bin.js
          cp node_modules/@mediapipe/hands/hands_solution_simd_wasm_bin.wasm github-pages-dist/christmas-tree/vendor/hands_solution_simd_wasm_bin.wasm
          cp node_modules/@mediapipe/hands/hands_solution_wasm_bin.js github-pages-dist/christmas-tree/vendor/hands_solution_wasm_bin.js
          cp node_modules/@mediapipe/hands/hands_solution_wasm_bin.wasm github-pages-dist/christmas-tree/vendor/hands_solution_wasm_bin.wasm
          cp node_modules/three/build/three.min.js github-pages-dist/christmas-tree/vendor/three.min.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
