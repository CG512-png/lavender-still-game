name: Deploy LAVENDER, STILL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build game
        run: npm run build

      - name: Include Christmas tree app with Tasks Vision
        run: |
          mkdir -p github-pages-dist/christmas-tree/vendor/wasm
          cp christmas-tree/index.html github-pages-dist/christmas-tree/index.html
          cp christmas-tree/app.js github-pages-dist/christmas-tree/app.js
          cp node_modules/three/build/three.min.js github-pages-dist/christmas-tree/vendor/three.min.js
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs github-pages-dist/christmas-tree/vendor/vision_bundle.mjs
          cp -r node_modules/@mediapipe/tasks-vision/wasm/* github-pages-dist/christmas-tree/vendor/wasm/
          curl -L --fail --retry 3 \
            https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task \
            -o github-pages-dist/christmas-tree/vendor/gesture_recognizer.task

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
